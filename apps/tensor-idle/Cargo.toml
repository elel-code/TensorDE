[package]
name = "tensor-idle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "Independent idle policy service for TensorDE"

[dependencies]
async-channel = "2"
compio = { version = "0.19", default-features = false, features = ["io-uring", "runtime"] }
futures-util = "0.3"
tensor-dbus = { path = "../../crates/tensor-dbus" }
tensor-kdl = { path = "../../crates/tensor-kdl" }
tensor-runtime = { path = "../../crates/tensor-runtime" }
thiserror = "2"
wayland-client-runtime = { path = "../../crates/wayland-client-runtime", features = ["compio"] }

[lints]
workspace = true
