[package]
name = "tensor-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "Native GPU-first Tensor Shell"

[dependencies]
async-channel = "2"
futures-util = "0.3"
serde = "1"
tensor-dbus = { path = "../../crates/tensor-dbus" }
tensor-kdl = { path = "../../crates/tensor-kdl" }
tensor-runtime = { path = "../../crates/tensor-runtime" }
thiserror = "2"
vulkan-renderer = { path = "../../crates/vulkan-renderer" }
wayland-client-runtime = { path = "../../crates/wayland-client-runtime", features = ["compio"] }

[lints]
workspace = true
