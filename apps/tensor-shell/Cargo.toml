[package]
name = "tensor-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "Native GPU-first Tensor Shell"

[dependencies]
async-io = "2"
futures-lite = "2"
thiserror = "2"
vulkan-renderer = { path = "../../crates/vulkan-renderer" }
wayland-client-runtime = { path = "../../crates/wayland-client-runtime", features = ["compio"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[lints]
workspace = true
