[package]
name = "tensor-files"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
default-run = "tensor-files"
autobins = false

[lib]
name = "tensor_files_core"

[[bin]]
name = "tensor-files"
path = "src/main.rs"

[[bin]]
name = "tensor-files-privileged-helper"
path = "src/bin/tensor-files-privileged-helper.rs"

[dependencies]
async-channel = "2"
async-lock = "3"
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
bytemuck = { version = "1", features = ["derive"] }
compio = { version = "0.19", default-features = false, features = ["fs", "io", "io-uring", "macros", "runtime", "time"] }
compio-process = "0.9"
cosmic-text = "0.19"
futures-channel = "0.3"
futures-lite = "2"
gio = "0.22"
gbm = { version = "0.18", default-features = false }
image = "0.25"
lyon = "1"
notify = "8"
roxmltree = "0.21"
serde = "1"
# Safe syscall wrappers (access). Already in the graph via wayland.
# `fs` covers memfd/seals used by dmabuf import smoke tests.
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
svgtypes = "0.16"
tensor-dbus = { path = "../../crates/tensor-dbus" }
# Default features include Compio event-loop integration.
wayland-client-runtime = { path = "../../crates/wayland-client-runtime", features = ["compio"] }
vulkan-renderer = { path = "../../crates/vulkan-renderer" }
xkeysym = "0.2"
