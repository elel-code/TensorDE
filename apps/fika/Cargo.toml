[package]
name = "fika"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
default-run = "fika"

[lib]
name = "fika_core"

[dependencies]
async-channel = "2"
async-io = "2"
async-lock = "3"
async-process = "2"
bytemuck = { version = "1", features = ["derive"] }
compio = { version = "0.19", default-features = false, features = ["fs", "io", "io-uring", "macros", "runtime"] }
cosmic-text = "0.19"
futures-channel = "0.3"
futures-lite = "2"
gio = "0.22"
gbm = { version = "0.18", default-features = false }
image = "0.25"
lyon = "1"
notify = "8"
roxmltree = "0.21"
# Safe syscall wrappers (access). Already in the graph via async-io / wayland.
# `fs` covers memfd/seals used by dmabuf import smoke tests.
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
svgtypes = "0.16"
pollster = "1"
# Default features include Compio event-loop integration.
wayland-client-runtime = { path = "../../crates/wayland-client-runtime", features = ["compio"] }
vulkan-renderer = { path = "../../crates/vulkan-renderer" }
wgpu = "30"
xkeysym = "0.2"
# zbus 5 default executor is async-io; avoid the optional tokio feature so the
# main runtime path can stay Compio-first without a second reactor island.
zbus = { version = "5", default-features = false, features = ["async-io"] }
# zbus_polkit has no standalone async-io feature; its default enables zbus/async-io
# (and blocking-api). Avoid the optional `tokio` feature so polkit stays on async-io.
zbus_polkit = "5"
