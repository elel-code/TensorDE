[package]
name = "tensor-greeter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "Native greetd frontend and authentication model for TensorDE"

[dependencies]
compio = { version = "0.19", default-features = false, features = ["io", "io-uring", "net", "runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tensor-dbus = { path = "../../crates/tensor-dbus" }
tensor-kdl = { path = "../../crates/tensor-kdl" }
tensor-present = { path = "../../crates/tensor-present" }
tensor-runtime = { path = "../../crates/tensor-runtime" }
thiserror = "2"
vulkan-renderer = { path = "../../crates/vulkan-renderer" }
wayland-client-runtime = { path = "../../crates/wayland-client-runtime", default-features = false, features = ["compio"] }
xkeysym = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
