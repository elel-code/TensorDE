[package]
name = "tensor-settings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "Standalone settings application for TensorDE products"

[dependencies]
compio = { version = "0.19", default-features = false, features = ["runtime", "time"] }
tensor-kdl = { path = "../../crates/tensor-kdl" }
tensor-ipc = { path = "../../crates/tensor-ipc" }
tensor-present = { path = "../../crates/tensor-present" }
tensor-runtime = { path = "../../crates/tensor-runtime" }
thiserror = "2"
vulkan-renderer = { path = "../../crates/vulkan-renderer" }
wayland-client-runtime = { path = "../../crates/wayland-client-runtime", default-features = false, features = ["compio"] }
xkeysym = "0.2"

[lints]
workspace = true
