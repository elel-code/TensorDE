[package]
name = "tensor-compositor"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
default-run = "tensor-compositor"
description = "A Smithay and Vulkanalia based Wayland compositor"
license = "MIT OR Apache-2.0"

[workspace]
members = [
    ".",
    "crates/tensor-util",
    "crates/tensor-event",
    "crates/tensor-runtime",
    "crates/tensor-host",
    "crates/tensor-drm",
    "crates/tensor-present",
    "crates/tensor-input",
    "crates/tensor-protocol",
]
resolver = "3"

[features]
default = ["tty", "xwayland"]
systemd = ["dep:sd-notify", "dep:zbus"]
tty = [
    "dep:calloop-wayland-source",
    "dep:drm",
    "dep:drm-ffi",
    "dep:gbm",
    "dep:input",
    "dep:libseat",
    "dep:smithay-drm-extras",
    "dep:udev",
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_session",
]
xwayland = ["smithay/xwayland"]

[dependencies]
bevy_ecs = { version = "0.19", default-features = false, features = ["std", "multi_threaded"] }
calloop = "0.14"
calloop-wayland-source = { version = "0.4", optional = true }
clap = { version = "4", features = ["derive"] }
# Compio = completion model; io-uring is the product driver; `polling` is Compio's host fallback only.
compio = { version = "0.19", default-features = false, features = ["runtime", "async-fd", "io-uring", "polling", "fs", "net"] }
drm = { version = "0.14", optional = true }
drm-ffi = { version = "0.9", optional = true }
futures-channel = "0.3"
futures-util = "0.3"
gbm = { version = "0.18", optional = true }
input = { version = "0.10", default-features = false, optional = true, features = ["libinput_1_19", "udev"] }
libseat = { version = "0.2", default-features = false, optional = true }
libc = "0.2"
rustix = { version = "1", features = ["fs", "net", "pipe", "process"] }
smithay = { git = "https://github.com/Smithay/smithay.git", branch = "master", default-features = false, features = ["desktop", "wayland_frontend"] }
smithay-drm-extras = { git = "https://github.com/Smithay/smithay.git", branch = "master", default-features = false, optional = true }
sd-notify = { version = "0.5", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tensor-drm = { path = "crates/tensor-drm" }
tensor-event = { path = "crates/tensor-event" }
tensor-host = { path = "crates/tensor-host" }
tensor-input = { path = "crates/tensor-input" }
tensor-present = { path = "crates/tensor-present" }
tensor-protocol = { path = "crates/tensor-protocol" }
tensor-runtime = { path = "crates/tensor-runtime" }
tensor-util = { path = "crates/tensor-util" }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
udev = { version = "0.9", optional = true }
vulkanalia = { version = "0.35", features = ["libloading"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "server", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
wayland-server = "0.31"
zbus = { version = "5", optional = true }

[[bin]]
name = "tensor-dmabuf-smoke"
path = "src/bin/tensor-dmabuf-smoke.rs"
required-features = ["tty"]

[profile.release]
codegen-units = 1
lto = "thin"
