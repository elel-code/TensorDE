name: Tensor

on:
  push:
  pull_request:

jobs:
  check:
    # Ubuntu 24.04 ships libinput 1.25; Tensor's tty path needs >= 1.26
    # (pad dials, device bustype) via the `input` crate's libinput_1_26 feature.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # tensorland default features include `tty`, which links system
      # libudev/libinput/libseat/libdrm/gbm/wayland/xkbcommon and compiles
      # client shaders with glslangValidator in build.rs.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libdrm-dev \
            libgbm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            glslang-tools
      - run: cargo fmt --all -- --check
      - run: uv run scripts/tensorland/check_file_lines.py
      - run: uv run scripts/tensorland/check_crate_boundaries.py
      - run: >-
          cargo test --all-targets
          -p tensorland
          -p tensor-drm
          -p tensor-event
          -p tensor-host
          -p tensor-present
          -p tensor-protocol
          -p tensor-runtime
          -p tensor-util
