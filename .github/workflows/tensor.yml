name: Tensor

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: uv run scripts/tensor/check_file_lines.py
      - run: uv run scripts/tensor/check_crate_boundaries.py
      - run: >-
          cargo test --all-targets
          -p tensor-compositor
          -p tensor-drm
          -p tensor-event
          -p tensor-host
          -p tensor-present
          -p tensor-protocol
          -p tensor-runtime
          -p tensor-util
