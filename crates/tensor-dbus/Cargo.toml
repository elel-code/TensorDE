[package]
name = "tensor-dbus"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Compio-native asynchronous D-Bus transport for TensorDE"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/elel-code/TensorDE"
documentation = "https://docs.rs/tensor-dbus"

[dependencies]
compio = { version = "0.19", default-features = false, features = ["runtime", "io", "io-ancillary", "net", "io-uring", "bytemuck"] }
libc = "0.2"
rustix = { version = "1", features = ["net", "process", "rand"] }
serde = "1"
thiserror = "2"
zvariant = "5"

[dev-dependencies]
compio = { version = "0.19", default-features = false, features = ["time"] }
serde = { version = "1", features = ["derive"] }
tensor-runtime = { path = "../tensor-runtime" }

[lints]
workspace = true
