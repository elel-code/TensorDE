[package]
name = "wayland-client-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Wayland-native client protocol stack with an optional Compio event loop"
readme = "README.md"
repository = "https://github.com/elel-code/TensorDE"
documentation = "https://docs.rs/wayland-client-runtime"
keywords = ["wayland", "windowing", "wgpu", "vulkan", "compio"]
categories = ["gui", "os::linux-apis"]

[features]
default = ["compio"]
# Compio io_uring readiness + NativeRuntime::dispatch waits.
# Disable for embedding into another event loop (calloop, winit, tokio, …):
#   wayland-client-runtime = { version = "…", default-features = false }
compio = ["dep:compio"]

[dependencies]
bitflags = "2"
compio = { version = "0.19", default-features = false, features = ["io", "io-uring", "macros", "runtime", "time"], optional = true }
raw-window-handle = "0.6"
# Safe syscall wrappers (eventfd, memfd, seals, fcntl nonblock).
# `mm` maps linux-dmabuf format tables (and other mmap needs) without memmap2.
rustix = { version = "1", default-features = false, features = ["event", "fs", "mm", "std"] }
thiserror = "2"
# `system` exposes ObjectId::as_ptr for raw-window-handle / wgpu.
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.8", features = ["wayland"] }

[[example]]
name = "native_csd_smoke"
required-features = ["compio"]

[[example]]
name = "native_toplevel_smoke"
required-features = ["compio"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
