[package]
name = "wayland-client-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "A Wayland-native client protocol, surface, and event runtime (Compio + native stack)"
readme = "README.md"
repository = "https://github.com/elel-code/fika"
documentation = "https://docs.rs/wayland-client-runtime"
keywords = ["wayland", "compio", "windowing", "wgpu", "vulkan"]
categories = ["gui", "os::linux-apis"]

[dependencies]
bitflags = "2"
compio = { version = "0.19", default-features = false, features = ["io", "io-uring", "macros", "runtime", "time"] }
libc = "0.2"
raw-window-handle = "0.6"
thiserror = "2"
# `system` exposes ObjectId::as_ptr for raw-window-handle / wgpu.
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.8", features = ["wayland"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
