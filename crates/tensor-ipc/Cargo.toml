[package]
name = "tensor-ipc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
description = "Lightweight value protocols and clients for Tensor product IPC"

[dependencies]
compio = { version = "0.19", default-features = false, features = ["io", "io-uring", "net", "runtime", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tensor-runtime = { path = "../tensor-runtime" }

[lints]
workspace = true
